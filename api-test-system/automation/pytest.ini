[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -ra --tb=short --strict-markers
markers =
    auth: 认证与鉴权
    subject: 学科管理
    question: 题库管理
    paper: 试卷与任务管理
    exam: 学生考试闭环
    message: 消息通知
    user: 用户管理
    security: 安全与权限
    e2e: 端到端全链路
    p0: 最高优先级（冒烟/核心）
    p1: 高优先级
    p2: 中优先级
    p3: 低优先级
